---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    resource-state-metrics.instrumentation.k8s-sigs.io/aggregate-to-exporter: "true"
  name: state-metrics-role
rules:
- apiGroups:
  - another.example.com
  resources:
  - foobars
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bar.example.com
  resources:
  - foos
  verbs:
  - get
  - list
  - watch
